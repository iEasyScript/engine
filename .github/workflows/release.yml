# Builds everything installable and, on a v* tag, attaches it to a GitHub Release.
#
# The Release is the contract: the launcher's Plugins tab reads
# plugins-manifest.json from the newest release, and every jar, bootstrap and
# bundle it offers is an asset on that same release. A branch push builds the
# same artifacts and uploads them as workflow artifacts, so a break surfaces
# before a tag depends on it.
name: release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      tag: ${{ steps.pick.outputs.tag }}
      is_release: ${{ steps.pick.outputs.is_release }}
    steps:
      # One place decides the version every other job stamps in, so a run can
      # never emit a launcher and a plugin jar that disagree.
      - id: pick
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            short="$(echo "$GITHUB_SHA" | cut -c1-8)"
            version="0.0.0-dev.$GITHUB_RUN_NUMBER.$short"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "resolved version: $version"

  plugins:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: official-scripts
            task: ":client-plugin-engine:official-scripts:jar"
            dir: client-plugin-engine/official-scripts/build/libs
            extra: ""
          - module: community-scripts
            task: ":client-plugin-engine:community-scripts:jar"
            dir: client-plugin-engine/community-scripts/build/libs
            # settings.gradle.kts only includes the module when this is set.
            extra: "-PcommunityScripts=true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      # The per-module jar task is deliberately narrower than assemble: it never
      # pulls the engine's CMake tasks in, so this job needs no C++ toolchain.
      - name: Build jar
        run: |
          chmod +x ./gradlew
          ./gradlew --stacktrace -PprojectxVersion=${{ needs.version.outputs.version }} ${{ matrix.extra }} ${{ matrix.task }}
      - name: Stage
        run: |
          set -eu
          v='${{ needs.version.outputs.version }}'
          m='${{ matrix.module }}'
          mkdir -p dist
          cp "${{ matrix.dir }}/$m-$v.jar" "dist/$m-$v.jar"
          cd dist && sha256sum "$m-$v.jar" > "$m-$v.jar.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.module }}
          path: dist/

  engine-jar:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # re-resources is fetched separately below: it is a private repository,
          # so it needs its own key rather than the workflow token.
          submodules: false
      # A read-only deploy key scoped to reclass-data. Checkout's own ssh-key
      # input cannot be used, because it would clone this repository with the
      # same key and that key has no access here.
      - name: Fetch the RE resources submodule
        env:
          KEY: ${{ secrets.RECLASS_DATA_DEPLOY_KEY }}
        run: |
          set -eu
          if [ -z "${KEY:-}" ]; then
            echo "RECLASS_DATA_DEPLOY_KEY is not set; the gameval guard will fail the build" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$KEY" > ~/.ssh/reclass_data
          chmod 600 ~/.ssh/reclass_data
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/reclass_data -o IdentitiesOnly=yes"
          git config --global url."git@github.com:".insteadOf "https://github.com/"
          git submodule update --init --depth 1 re-resources
          test -n "$(find re-resources/gamevals -name '*.json' -print -quit)"
          echo "gamevals: $(find re-resources/gamevals -name '*.json' | wc -l) dictionaries"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      # The runner image ships cmake, so the engine's native tasks would run here
      # and fail for want of SDL2. Exclude them: the bootstraps are built by
      # their own jobs, on runners that install the toolchain.
      - name: Build engine jar
        run: |
          chmod +x ./gradlew
          ./gradlew --stacktrace -PprojectxVersion=${{ needs.version.outputs.version }}             :client-plugin-engine:shadowJar :client-plugin-engine:copySupervisorJar             -x :client-plugin-engine:configureNativeBootstrap             -x :client-plugin-engine:buildNativeBootstrap             -x :client-plugin-engine:copyNativeLibToBuild
      - name: Stage
        run: |
          set -eu
          v='${{ needs.version.outputs.version }}'
          mkdir -p dist
          cp client-plugin-engine/build/libs/*-all.jar "dist/projectx-engine-$v.jar"
          cp client-plugin-engine/build/libs/projectx-supervisor.jar "dist/projectx-supervisor-$v.jar"
          cd dist && sha256sum "projectx-engine-$v.jar" "projectx-supervisor-$v.jar" > "engine-$v.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: engine-jar
          path: dist/

  bootstrap-linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Fetch the native submodules
        run: git submodule update --init --depth 1 client-plugin-engine/native-bootstrap/funchook client-plugin-engine/native-bootstrap/imgui
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake clang lld make libsdl2-dev libopengl-dev libegl-dev
      - name: Build
        run: |
          set -eu
          cd client-plugin-engine/native-bootstrap
          cmake --preset linux-clang
          cmake --build --preset linux-clang
      - name: Stage
        run: |
          set -eu
          v='${{ needs.version.outputs.version }}'
          mkdir -p dist
          cp client-plugin-engine/native-bootstrap/build/libprojectxbootstrap.so "dist/libprojectxbootstrap-$v.so"
      - uses: actions/upload-artifact@v4
        with:
          name: bootstrap-linux
          path: dist/

  bootstrap-windows:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Fetch the native submodules
        run: git submodule update --init --depth 1 client-plugin-engine/native-bootstrap/funchook client-plugin-engine/native-bootstrap/imgui
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake mingw-w64 make curl unzip
      # A Windows JDK, not the host one: find_package(JNI) would otherwise resolve
      # a jni_md.h that defines jint/jlong for LP64 rather than the LLP64 the DLL
      # needs. Headers only; the JVM is loaded at runtime via LoadLibraryW.
      - name: Fetch Windows JNI headers
        id: jni
        run: |
          set -eu
          curl -fsSL -o winjdk.zip "https://api.adoptium.net/v3/binary/latest/25/ga/windows/x64/jdk/hotspot/normal/eclipse?project=jdk"
          mkdir -p winjdk
          unzip -q winjdk.zip -d winjdk
          inc="$(find "$PWD/winjdk" -maxdepth 3 -type d -name include | head -1)"
          test -f "$inc/jni.h"
          echo "include=$inc" >> "$GITHUB_OUTPUT"
      - name: Build
        run: |
          set -eu
          cd client-plugin-engine/native-bootstrap
          cmake --preset windows-mingw -DJNI_INCLUDE_DIRS="${{ steps.jni.outputs.include }};${{ steps.jni.outputs.include }}/win32"
          cmake --build --preset windows-mingw
      # The DLL is injected into a client that knows nothing about MinGW, so a
      # lost static-runtime option must fail here rather than at LoadLibraryW.
      - name: Verify no MinGW runtime dependency
        run: |
          set -eu
          dll=client-plugin-engine/native-bootstrap/build-windows-mingw/projectxbootstrap.dll
          if x86_64-w64-mingw32-objdump -p "$dll" | grep -E 'libgcc_s_seh-1|libstdc\+\+-6|libwinpthread-1'; then
            echo "static-runtime link options were lost" >&2
            exit 1
          fi
      - name: Stage
        run: |
          set -eu
          v='${{ needs.version.outputs.version }}'
          mkdir -p dist
          cp client-plugin-engine/native-bootstrap/build-windows-mingw/projectxbootstrap.dll "dist/projectxbootstrap-$v.dll"
      - uses: actions/upload-artifact@v4
        with:
          name: bootstrap-windows
          path: dist/

  launcher:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            archive: targz
          - name: windows-x86_64
            runner: windows-latest
            archive: zip
          - name: macos-universal
            runner: macos-latest
            archive: bare
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/launcher
      - name: Linux webview deps
        if: matrix.runner == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - name: Build the launcher
        run: cargo build --release --manifest-path client/launcher/Cargo.toml --bin project-x-launcher
      # A bare launcher is not a working install: a patched launch needs the
      # patcher, and injection needs the injectors. They are small and
      # platform-specific, so they ship in the bundle.
      - name: Build the patcher and injectors
        shell: bash
        run: |
          set -eu
          case '${{ matrix.name }}' in
            windows-*) cargo build --release --manifest-path client/launcher/patcher-win/Cargo.toml ;;
            linux-*)   cargo build --release --manifest-path client/launcher/patcher/Cargo.toml ;;
            macos-*)   cargo build --release --manifest-path client/launcher/patcher-mac/Cargo.toml ;;
          esac
      - name: Stage
        shell: bash
        run: |
          set -eu
          mkdir -p stage
          case '${{ matrix.name }}' in
            windows-*)
              cp client/launcher/target/release/project-x-launcher.exe stage/
              cp client/launcher/patcher-win/target/release/projectx_patcher.dll stage/
              cp client/launcher/patcher-win/target/release/projectx_injector.exe stage/
              cp client/launcher/patcher-win/target/release/projectx_engine_injector.exe stage/
              ;;
            linux-*)
              cp client/launcher/target/release/project-x-launcher stage/
              cp client/launcher/patcher/target/release/libprojectx_patcher.so stage/
              ;;
            macos-*)
              cp client/launcher/target/release/project-x-launcher stage/
              cp client/launcher/patcher-mac/target/release/libprojectx_patcher.dylib stage/
              ;;
          esac
          ls -la stage/
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.name }}
          path: stage/

  # Per-platform bundles: everything needed for a working install, in the search
  # slots the launcher already uses. The ~160 MB engine jar is deliberately left
  # out — the launcher downloads that one asset into its data dir on first use,
  # so this download stays small and the engine can update without a new
  # launcher.
  #
  #   project-x-launcher[.exe]
  #   projectx_patcher.dll | libprojectx_patcher.so, *_injector.exe
  #   engine/  bootstrap + supervisor, the seed for PROJECTX_HOME_DIR
  bundle:
    needs: [version, launcher, engine-jar, bootstrap-linux, bootstrap-windows]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            bootstrap: bootstrap-linux
            archive: targz
          - name: windows-x86_64
            bootstrap: bootstrap-windows
            archive: zip
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "{launcher-${{ matrix.name }},${{ matrix.bootstrap }},engine-jar}"
          path: incoming
      - name: Assemble
        run: |
          set -eu
          v='${{ needs.version.outputs.version }}'
          n='${{ matrix.name }}'
          dir="project-x-launcher-$n-$v"
          mkdir -p "$dir/engine" dist

          cp incoming/launcher-$n/* "$dir/"
          # The bootstrap ships versioned as its own release asset; inside the
          # bundle it takes the fixed name the injector resolves by.
          for f in incoming/${{ matrix.bootstrap }}/*; do
            case "$f" in
              *.so)  cp "$f" "$dir/engine/libprojectxbootstrap.so" ;;
              *.dll) cp "$f" "$dir/engine/projectxbootstrap.dll" ;;
            esac
          done
          cp incoming/engine-jar/projectx-supervisor-*.jar "$dir/engine/projectx-supervisor.jar"

          chmod +x "$dir/project-x-launcher" 2>/dev/null || true
          find "$dir" -type f | sort

          case '${{ matrix.archive }}' in
            zip)   zip -qr "dist/$dir.zip" "$dir" ;;
            targz) tar -czf "dist/$dir.tar.gz" "$dir" ;;
          esac
          cd dist && for f in *; do sha256sum "$f" > "$f.sha256"; done
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.name }}
          path: dist/

  release:
    needs: [version, plugins, engine-jar, bootstrap-linux, bootstrap-windows, launcher, bundle]
    if: needs.version.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: incoming
      # Every job staged into its own dist/, so flatten them into the one set the
      # manifest describes and the release carries.
      - name: Collect
        run: |
          set -eu
          mkdir -p dist
          find incoming -type f -exec cp -n {} dist/ \;
          ls -la dist/
      - name: Build manifest
        env:
          PROJECTX_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq
          chmod +x .github/ci/build-manifest.sh
          ./.github/ci/build-manifest.sh dist plugins-manifest.json
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Project X ${{ needs.version.outputs.version }}
          body: |
            Launcher bundles, the Project X engine and plugin jars for ${{ needs.version.outputs.version }}.

            The launcher installs the engine jar and the plugin jars from this
            release itself, verified against plugins-manifest.json.
          files: |
            dist/*
            plugins-manifest.json

  # Launcher downloads have to be publicly reachable, and release assets on a
  # private repository are not. So the bundles are published to a public
  # distribution repository that holds no source, giving users permanent
  # `releases/latest/download/...` links.
  publish-launcher:
    needs: [version, bundle]
    if: needs.version.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: incoming
      - name: Collect
        run: |
          set -eu
          mkdir -p dist
          find incoming -type f -exec cp -n {} dist/ \;
          ls -la dist/
      - name: Publish to the public launcher repository
        env:
          # A PAT with contents:write on iEasyScript/launcher. The default token
          # cannot write to another repository.
          GH_TOKEN: ${{ secrets.LAUNCHER_RELEASE_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "LAUNCHER_RELEASE_TOKEN is not set; skipping public publish" >&2
            exit 1
          fi
          gh release create "$TAG" -R iEasyScript/launcher             --title "Project X Launcher $VERSION"             --notes "Launcher builds for Windows and Linux. The launcher installs the engine and scripts itself."             dist/* || gh release upload "$TAG" -R iEasyScript/launcher dist/* --clobber
