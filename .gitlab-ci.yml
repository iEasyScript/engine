# Project X CI/CD
#
# Produces, for every pipeline, everything a user can install:
#   * per-platform launcher bundles (launcher + patcher + injectors + the engine
#     bootstrap and supervisor) for Linux and Windows, a bare binary for macOS,
#   * the Project X engine jar the launcher installs on first use,
#   * the first-party `official-scripts` plugin jar,
#   * the community `community-scripts` plugin jar,
# and, on a `v*` tag, publishes them to the Generic Package Registry and attaches
# them to a GitLab Release. The launcher's Plugins tab reads that Release.
#
# The per-job definitions live in .gitlab/ci/ so this file stays a table of contents.

stages:
  - prepare
  - build
  - package
  - publish

variables:
  # re-resources/ is a multi-hundred-MB knowledge hub, so it is off by default —
  # cloning it in every job would dominate setup time. The jobs that genuinely need
  # a submodule opt in by name: engine:jar packages re-resources/gamevals into the
  # shadow jar, and the bootstraps compile funchook + imgui.
  GIT_SUBMODULE_STRATEGY: none
  GIT_DEPTH: "50"
  # Keep both toolchains' caches inside the workspace so `cache:` can carry them.
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home"
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo-home"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  # Generic Package Registry coordinates. The launcher resolves artifacts through
  # the Release's asset links, so this name only has to stay stable, not be known
  # to the client.
  PACKAGE_NAME: "projectx"

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

include:
  - local: .gitlab/ci/prepare.yml
  - local: .gitlab/ci/plugins.yml
  - local: .gitlab/ci/engine.yml
  - local: .gitlab/ci/launcher.yml
  - local: .gitlab/ci/bundle.yml
  - local: .gitlab/ci/publish.yml
