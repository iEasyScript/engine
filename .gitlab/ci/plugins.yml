# Plugin jars — the artifacts the launcher's Plugins tab installs into
# ~/.projectx/scripts/. Both modules build the same way; only the Gradle path and
# the settings.gradle.kts opt-in property differ.
#
# `:<module>:jar` is deliberately narrower than `assemble`: it never pulls the
# engine's CMake tasks into the graph, so no job needs a C++ toolchain.

.plugin-build:
  stage: build
  image: eclipse-temurin:25-jdk
  needs: [version]
  interruptible: true
  variables:
    # A plugin jar is decided entirely by the sources and the version stamp, so
    # the Gradle build cache is safe to share across branches.
    GRADLE_BUILD_CACHE_KEY: "gradle"
  cache:
    key: "$GRADLE_BUILD_CACHE_KEY"
    paths:
      - .gradle-home/caches/modules-2
      - .gradle-home/caches/build-cache-1
      - .gradle-home/wrapper/dists
  before_script:
    - chmod +x ./gradlew
  script:
    - ./gradlew --stacktrace -PprojectxVersion="$PROJECTX_VERSION" $GRADLE_EXTRA_ARGS "$GRADLE_TASK"
    - mkdir -p dist
    - cp "$JAR_DIR/$MODULE-$PROJECTX_VERSION.jar" "dist/$MODULE-$PROJECTX_VERSION.jar"
    - (cd dist && sha256sum "$MODULE-$PROJECTX_VERSION.jar" > "$MODULE-$PROJECTX_VERSION.jar.sha256")
    - cat "dist/$MODULE-$PROJECTX_VERSION.jar.sha256"
  artifacts:
    name: "$MODULE-$PROJECTX_VERSION"
    paths:
      - dist/
    expire_in: 30 days

plugins:official:
  extends: .plugin-build
  variables:
    MODULE: official-scripts
    GRADLE_TASK: ":client-plugin-engine:official-scripts:jar"
    JAR_DIR: client-plugin-engine/official-scripts/build/libs

plugins:community:
  extends: .plugin-build
  variables:
    MODULE: community-scripts
    GRADLE_TASK: ":client-plugin-engine:community-scripts:jar"
    JAR_DIR: client-plugin-engine/community-scripts/build/libs
    # settings.gradle.kts only includes the module when this property is present.
    GRADLE_EXTRA_ARGS: "-PcommunityScripts=true"
