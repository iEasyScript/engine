# Tag-only publication. Branch pipelines still build and expose every artifact as
# a job artifact; only a `v*` tag turns them into a Release, because a Release is
# exactly what the launcher's update check reads.

.tag-only:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

publish:packages:
  extends: .tag-only
  stage: publish
  image: alpine:3.20
  needs:
    - version
    - job: plugins:official
      artifacts: true
    - job: plugins:community
      artifacts: true
    - job: engine:jar
      artifacts: true
    # Not only through the bundles: each bootstrap is its own release asset, so
    # the launcher can update the native side without a new launcher download.
    - job: engine:bootstrap:linux
      artifacts: true
    - job: engine:bootstrap:windows
      artifacts: true
    - job: bundle:linux
      artifacts: true
    - job: bundle:windows
      artifacts: true
    # Present only when a macOS runner is configured; the Release simply carries
    # no macOS asset otherwise.
    - job: launcher:macos
      artifacts: true
      optional: true
  before_script:
    - apk add --no-cache curl jq coreutils
    # The bundle jobs stage their archives separately so they never re-upload the
    # engine jar they had to pull in; this is where everything becomes one set.
    - mkdir -p dist
    - if [ -d bundle ]; then cp -a bundle/. dist/; fi
  script:
    - ls -la dist/
    - ./.gitlab/ci/build-manifest.sh dist plugins-manifest.json
    - ./.gitlab/ci/publish-packages.sh dist plugins-manifest.json release-links.txt
  artifacts:
    paths:
      - plugins-manifest.json
      - release-links.txt
    expire_in: never

publish:release:
  extends: .tag-only
  stage: publish
  # Pinned: `latest` tightened asset-link validation under us once already, and a
  # release job is the one job that only ever fails in production.
  image: registry.gitlab.com/gitlab-org/release-cli:v0.24.0
  needs:
    - version
    - job: publish:packages
      artifacts: true
  script:
    - |
      set -- create --name "Project X $PROJECTX_VERSION" --tag-name "$CI_COMMIT_TAG" \
        --description "Launcher bundles, the Project X engine and plugin jars for $PROJECTX_VERSION. Each bundle carries the launcher, the client patcher and the engine bootstrap; the launcher installs the engine jar and the plugin jars from this release itself."
      while IFS= read -r link; do
        [ -n "$link" ] || continue
        set -- "$@" --assets-link "$link"
      done < release-links.txt
      release-cli "$@"
