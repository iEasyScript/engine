# Per-platform release bundles: everything a user needs in one archive.
#
# A bare launcher binary is not a working install — a custom-server launch needs
# the patcher (and, on Windows, the injectors), and the engine needs its native
# bootstrap and the supervisor jar. Those are all small and platform-specific, so
# they ship in the archive. The engine's ~150 MB shadow jar does not: it is one
# release asset the launcher downloads into its data dir on first use, which
# keeps this download in the tens of megabytes and lets the engine update
# without a new launcher.
#
# Layout (the search slots the launcher already uses, nothing new to learn):
#   project-x-launcher[.exe]        the launcher itself
#   projectx_patcher.dll|libprojectx_patcher.so, *_injector.exe
#   engine/                      bootstrap + supervisor == PROJECTX_HOME_DIR seed

.bundle:
  stage: package
  image: alpine:3.20
  interruptible: true
  before_script:
    - apk add --no-cache coreutils tar zip
    - BUNDLE_DIR="project-x-launcher-$PLATFORM_TAG-$PROJECTX_VERSION"
    - mkdir -p "$BUNDLE_DIR/engine" bundle
    - cp engine-stage/projectx-supervisor.jar "$BUNDLE_DIR/engine/"
  artifacts:
    name: "project-x-launcher-$PLATFORM_TAG-$PROJECTX_VERSION"
    paths:
      - bundle/
    expire_in: 30 days

bundle:linux:
  extends: .bundle
  variables:
    PLATFORM_TAG: linux-x86_64
  needs:
    - version
    - job: launcher:linux
      artifacts: true
    - job: engine:jar
      artifacts: true
    - job: engine:bootstrap:linux
      artifacts: true
  script:
    - cp stage/project-x-launcher stage/libprojectx_patcher.so "$BUNDLE_DIR/"
    - cp engine-stage/libprojectxbootstrap.so "$BUNDLE_DIR/engine/"
    - chmod +x "$BUNDLE_DIR/project-x-launcher"
    - tar -czf "bundle/$BUNDLE_DIR.tar.gz" "$BUNDLE_DIR"
    - (cd bundle && sha256sum "$BUNDLE_DIR.tar.gz" > "$BUNDLE_DIR.tar.gz.sha256")

bundle:windows:
  extends: .bundle
  variables:
    PLATFORM_TAG: windows-x86_64
  needs:
    - version
    - job: launcher:windows
      artifacts: true
    - job: engine:jar
      artifacts: true
    - job: engine:bootstrap:windows
      artifacts: true
  script:
    - cp stage/project-x-launcher.exe stage/projectx_patcher.dll stage/projectx_injector.exe stage/projectx_engine_injector.exe "$BUNDLE_DIR/"
    - cp engine-stage/projectxbootstrap.dll "$BUNDLE_DIR/engine/"
    - zip -qr "bundle/$BUNDLE_DIR.zip" "$BUNDLE_DIR"
    - (cd bundle && sha256sum "$BUNDLE_DIR.zip" > "$BUNDLE_DIR.zip.sha256")
