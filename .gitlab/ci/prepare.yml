# One place decides the version string every other job stamps into its artifacts,
# so a pipeline can never emit a launcher and a plugin jar that disagree.
#
# A `v1.2.3` tag yields `1.2.3`; anything else yields a sortable pre-release that
# is still a legal Gradle version and a legal filename (no `+`, which the Generic
# Package Registry rejects in a version segment).
version:
  stage: prepare
  image: alpine:3.20
  interruptible: true
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        PROJECTX_VERSION="${CI_COMMIT_TAG#v}"
      else
        PROJECTX_VERSION="0.0.0-dev.${CI_PIPELINE_IID}.${CI_COMMIT_SHORT_SHA}"
      fi
      echo "PROJECTX_VERSION=$PROJECTX_VERSION" > version.env
      cat version.env
  artifacts:
    reports:
      dotenv: version.env
